name: toolbox-manager

services:
  postgres:
    image: postgres:16-alpine
    container_name: toolbox-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-toolbox}
      POSTGRES_USER: ${POSTGRES_USER:-toolbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-toolbox_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations/V001__initial_schema.sql:/docker-entrypoint-initdb.d/01-V001__initial_schema.sql:ro
      - ./database/migrations/V002__seed_data.sql:/docker-entrypoint-initdb.d/02-V002__seed_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-toolbox}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  localstack:
    image: localstack/localstack:3
    container_name: toolbox-localstack
    environment:
      SERVICES: sqs
      DEBUG: 0
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      SQS_ENDPOINT_STRATEGY: domain
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  seq:
    image: datalust/seq:latest
    container_name: toolbox-seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "${SEQ_PORT:-5341}:80"
    volumes:
      - seq-data:/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: toolbox-api
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      seq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-toolbox};Username=${POSTGRES_USER:-toolbox};Password=${POSTGRES_PASSWORD:-toolbox_dev_password}
      Aws__Region: ${AWS_REGION:-us-east-1}
      Aws__AccessKeyId: ${AWS_ACCESS_KEY_ID:-test}
      Aws__SecretAccessKey: ${AWS_SECRET_ACCESS_KEY:-test}
      Aws__SqsQueueName: ${AWS_SQS_QUEUE_NAME:-toolbox-run-requests}
      Aws__SqsServiceUrl: ${AWS_SQS_ENDPOINT:-http://localstack:4566}
      Seq__ServerUrl: ${SEQ_INGESTION_URL:-http://seq:5341}
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: toolbox-ui
    depends_on:
      - api
    ports:
      - "${UI_PORT:-5173}:80"
    restart: unless-stopped

volumes:
  postgres-data:
  localstack-data:
  seq-data:
