name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  api:
    name: API (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore api/ToolboxManager.Api.sln

      - name: Build
        run: dotnet build api/ToolboxManager.Api.sln -c Release --no-restore

  polling-service:
    name: Polling Service (build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore polling-service/ToolboxManager.PollingService.sln

      - name: Build
        run: dotnet build polling-service/ToolboxManager.PollingService.sln -c Release --no-restore

  ui:
    name: UI (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Type-check + build
        run: npm run build

  sample-apps:
    name: Sample apps (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build EchoTool
        run: dotnet build sample-apps/EchoTool/EchoTool.csproj -c Release
