name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "database/migrations/**"
      - ".github/workflows/api.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: toolbox-manager-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for OIDC auth to AWS
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:     ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # Replace this with whatever your runtime is. ECS example shown.
      - name: Trigger ECS deployment
        run: |
          aws ecs update-service \
            --cluster  "${{ vars.ECS_CLUSTER }}" \
            --service  "${{ vars.ECS_API_SERVICE }}" \
            --force-new-deployment
